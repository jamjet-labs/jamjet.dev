name: Links and coordinates

# Checks that external URLs and package coordinates (Maven, npm, PyPI,
# crates.io, Docker images) in the site content resolve. On a pull request it
# checks what the PR adds; every Monday it checks everything.
on:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check what this PR adds
        if: github.event_name == 'pull_request'
        run: node scripts/check-links.mjs --changed origin/${{ github.base_ref }}

      - name: Check all content
        if: github.event_name != 'pull_request'
        run: node scripts/check-links.mjs --all
